<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    16px 专用图标。
    16 像素只够表达 1-2 个形状，"星座连线"在这个尺寸必然丢失。
    改用「一颗四角星 + 三个小星」的简化构图：
    - 主体四角星：明确、对称、16px 下轮廓依然清晰
    - 三个小点：暗示"星群"，但不指望它们被逐个辨认
    这跟 macOS/iOS 图标的做法一致：小尺寸不是大图的等比缩小，而是重新设计的简化版。
  -->
  <rect width="32" height="32" rx="6" fill="#0f1a2e"/>

  <!-- 主星：四角星（sparkle 形），中心略偏左上留出呼吸空间 -->
  <path
    d="M14 6 L16.4 12.6 L23 15 L16.4 17.4 L14 24 L11.6 17.4 L5 15 L11.6 12.6 Z"
    fill="#f5c84c"
  />
  <!-- 中心高光，让星星不显得平 -->
  <circle cx="14" cy="15" r="2.6" fill="#fff"/>

  <!-- 三颗小星：分布在右下，形成对角平衡 -->
  <circle cx="24" cy="9" r="2" fill="#fff" opacity="0.95"/>
  <circle cx="25" cy="24" r="1.7" fill="#fff" opacity="0.8"/>
  <circle cx="7" cy="26" r="1.4" fill="#8fa8d4" opacity="0.7"/>
</svg>
